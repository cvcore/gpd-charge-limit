PACKAGE_NAME="gpd-charge-limit"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="gpd_charge_limit"
# Required syntactically; modern DKMS installs to /updates/dkms regardless.
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

MAKE[0]="make KERNELDIR=${kernel_source_dir}"
CLEAN="make KERNELDIR=${kernel_source_dir} clean"

AUTOINSTALL="yes"
